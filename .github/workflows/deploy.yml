name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/assets/pdfs/*.pdf)

          if (( ${#files[@]} == 0 )); then
            echo "::error::No PDF assets were found"
            exit 1
          fi

          for file in "${files[@]}"; do
            if [[ "$(LC_ALL=C head -c 5 "$file")" != "%PDF-" ]]; then
              echo "::error file=$file::The file is still a Git LFS pointer, not a materialized PDF"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mkdocs.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: python -m pip install -r requirements-mkdocs.txt

      - name: Build
        run: mkdocs build

      - name: Verify generated PDF assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          source_files=(docs/assets/pdfs/*.pdf)

          for source in "${source_files[@]}"; do
            relative_path="${source#docs/assets/pdfs/}"
            output="site/assets/pdfs/$relative_path"

            if [[ ! -f "$output" ]]; then
              echo "::error file=$output::The PDF was not copied to the MkDocs output"
              exit 1
            fi

            if [[ "$(LC_ALL=C head -c 5 "$output")" != "%PDF-" ]]; then
              echo "::error file=$output::The generated asset is not a valid PDF"
              exit 1
            fi
          done

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
